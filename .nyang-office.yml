# 냥오피스 기여자 캐릭터 설정
#
# 이 저장소를 보는 냥오피스(앱·위젯)는 이 파일을 읽어서 기여자 캐릭터 모습을 정해요.
# 적은 아이디만 바뀌고, 적지 않은 항목은 아이디로 정해지는 기본 모습 그대로예요.
# 이 파일을 고쳐서 기본 브랜치에 푸시하면 30분 안에 반영되고, 냥오피스 페이지를 새로고침하면 바로 반영돼요.
#
# 쓰는 법: characters: 아래에 "깃허브 아이디:" 를 쓰고, 그 아래에 바꾸고 싶은 항목만 적어요.
#
#   gender  성별: f(여성) / m(남성)
#           art 없이 gender 만 적으면 그 성별 모양 중 하나로 아이디에 따라 정해져요.
#   art     모양:
#           여성 - wavy(웨이브·가디건) longglasses(긴머리·안경·후드) ponytail(포니테일)
#                  ponyglasses(포니테일·안경·니트) bunhood(똥머리·후드) bob(단발)
#           남성 - short(짧은 머리·니트) fringe(앞머리·후드) curly(곱슬·가디건) beanie(비니)
#   색 (#rrggbb, 따옴표로 감싸기):
#           hair 머리  skin 피부  shirt 겉옷  inner 안쪽 옷  pants 바지  hat 모자
#
# 모양과 색을 눈으로 고르고 싶으면 냥오피스 전체 화면 상단의 "🎨 캐릭터 설정"에서 골라
# "바꾼 사람 전체 복사"로 복사한 뒤 아래에 붙여 넣으면 돼요.
# 내 컴퓨터의 ~/.config/agent-office/characters.yml 이 있으면 그쪽이 이 파일보다 먼저예요.

characters:
  akellysoft-junior:
    # gender: f        # ← 주석(#)을 지우고 f 또는 m 으로 바꿔 보세요
    # art: bob         # ← 모양을 고정하려면 위 목록에서 하나
    hair: "#2b2b33"    # 짙은 머리색
    shirt: "#e5534b"   # 빨간 겉옷 — 바꾸면 화면의 옷 색이 바뀌어요
    pants: "#4b5d7a"
