<title>캐릭터 조합실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 종이 위 스케치북: 왼쪽 미리보기 판, 오른쪽 옷장 서랍 */
:root{
  --paper:#fbf6ec; --paper-2:#f3ead9; --ink:#2b1d14; --muted:#7a6a5c; --accent:#e8735f; --line:#d9cbb6;
  --font-display:'Jua', 'Gowun Dodum', system-ui, sans-serif; --font-body:'Gowun Dodum', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#25211d; --paper-2:#2f2a24; --ink:#f3e9da; --muted:#b8a994; --accent:#f08a72; --line:#4a4035; color-scheme:dark } }
:root[data-theme="dark"]{ --paper:#25211d; --paper-2:#2f2a24; --ink:#f3e9da; --muted:#b8a994; --accent:#f08a72; --line:#4a4035; color-scheme:dark }
body{background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:20px 32px}
.wrap{max-width:1040px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
h1{font-family:var(--font-display); font-weight:400; font-size:28px; margin:0; text-wrap:balance}
.lede{margin:0; color:var(--muted); max-width:62ch}
.main{display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr); gap:16px; align-items:start}
@media (max-width:760px){ .main{grid-template-columns:minmax(0, 1fr)} }
.stage{background:var(--paper-2); border:2px solid var(--ink); border-radius:16px; box-shadow:4px 4px 0 var(--ink); padding:12px;
  display:flex; gap:8px; justify-content:center; align-items:flex-end; min-width:0}
.stage figure{margin:0; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; flex:1 1 0}
.stage canvas{width:100%; max-width:260px; height:auto; display:block}
.stage figcaption{font-size:12px; color:var(--muted)}
.panel{display:flex; flex-direction:column; gap:12px; min-width:0}
.group{display:flex; flex-direction:column; gap:6px}
.group > span{font-family:var(--font-display); font-size:14px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
button{font:inherit; color:var(--ink); background:var(--paper); border:1.5px solid var(--ink); border-radius:999px; padding:4px 12px; cursor:pointer}
button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.sw{width:28px; height:28px; padding:0; border-radius:50%}
.sw[aria-pressed="true"]{outline:3px solid var(--accent); outline-offset:2px; background-clip:padding-box}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.primary{background:var(--accent); color:#1f140d; border-color:var(--ink); font-family:var(--font-display)}
.count{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: no-preference){ .stage canvas{transition:opacity .15s} }
</style>
<div class="wrap">
  <h1>캐릭터 조합실</h1>
  <p class="lede">마네킹 위에 머리·상의·하의 레이어를 겹치고 부위마다 색을 바꿔요. 서 있는 자세와 작업 자세가 함께 바뀌어요.</p>
  <div class="main">
    <div class="stage" aria-live="polite">
      <figure><canvas id="cvStand" width="10" height="10" aria-label="서 있는 자세"></canvas><figcaption>서 있는 자세</figcaption></figure>
      <figure><canvas id="cvWork" width="10" height="10" aria-label="작업 자세"></canvas><figcaption>작업 자세</figcaption></figure>
    </div>
    <div class="panel" id="panel"></div>
  </div>
  <div class="row"><button type="button" class="primary" id="btnRandom">무작위로 하나</button><span class="count" id="count"></span></div>
</div>

const INK = [59, 29, 11], FIXED = {7:"#fbeee0", 8:"#b7b789", 9:"#fbeee0"};
const OUTER = 7, INNER = 4;                               // 실루엣 선 굵기 / 영역 사이 선 굵기 (반지름, px)
const disk = r => { const o = []; for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x*x + y*y <= r*r + r*0.6) o.push([x, y]); return o; };
const D_OUT = disk(OUTER), D_IN = disk(INNER);
function draw(pose, cv){
  const A = assets[pose], W = A.w, H = A.h, N = W * H;
  const lab = new Uint8Array(N), det = new Uint8Array(N);
  const M = A.mannequin, KEEP = v => v === 2 || v === 7 || v === 8;   // 피부(손·발목)·신발·머그는 늘 마네킹 것 (옷 그림의 거친 신발·머그 대신)
  const paint = (m, guard, zone, own) => { for (let i = 0, j = 0; i < N; i++, j += 4){
    if (guard && KEEP(M[j])) continue;
    if (zone && !(zone[j] > 0) && !own.includes(m[j])) continue;     // 옷 그림은 자기 부위(와 갈아 끼울 영역)만 — 다른 부위의 거친 부분은 안 가져옴
    if (m[j]){ lab[i] = m[j]; det[i] = m[j + 1] > 127 ? 1 : 0; } } };
  paint(M);
  const zones = [state.bottom && A.zone_bottom, state.top && A.zone_top].filter(Boolean);
  if (zones.length) for (let i = 0, j = 0; i < N; i++, j += 4) if (!KEEP(M[j]) && zones.some(z => z[j] > 0)){ lab[i] = 0; det[i] = 0; }
  if (state.bottom) paint(A[state.bottom], true, A.zone_bottom, [5]);
  if (state.top) paint(A[state.top], true, A.zone_top, [3, 4, 9]);
  if (state.hair) paint(A[state.hair]);
  // 외곽선: 경계 픽셀마다 원을 찍음 (실루엣은 굵게, 영역 사이는 가늘게, 늘 안쪽으로만)
  const ink = new Uint8Array(N);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++){
    const i = y * W + x, L = lab[i]; if (!L) continue;
    const nb = [lab[i - 1], lab[i + 1], lab[i - W], lab[i + W]];
    if (nb.every(v => v === L)) continue;
    const D = nb.includes(0) ? D_OUT : D_IN;
    for (const [dx, dy] of D){ const xx = x + dx, yy = y + dy;
      if (xx >= 0 && yy >= 0 && xx < W && yy < H){ const k = yy * W + xx; if (lab[k] === L || D === D_IN && lab[k]) ink[k] = 1; } }
  }
  const T = {}; for (const id in REGION_KEY) T[id] = hexRGB(colorsNow()[REGION_KEY[id]]);
  for (const id in FIXED) T[id] = hexRGB(FIXED[id]);
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(W, H), d = img.data;
  for (let i = 0, j = 0; i < N; i++, j += 4){
    const L = lab[i]; if (!L) continue;
    const c = ink[i] || det[i] ? INK : T[L];
    d[j] = c[0]; d[j + 1] = c[1]; d[j + 2] = c[2]; d[j + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
const colorsNow = () => ({hair:state.hairC, skin:state.skin, shirt:state.shirt, inner:state.inner, tee:state.tee, pants:state.pants});
function render(){ draw("stand", document.getElementById("cvStand")); draw("work", document.getElementById("cvWork")); syncPressed(); }

/* 고르는 판 */
const panel = document.getElementById("panel"), groups = [];
function group(key, items, swatch){
  const g = document.createElement("div"); g.className = "group";
  const t = document.createElement("span"); t.textContent = LABEL[key]; g.appendChild(t);
  const c = document.createElement("div"); c.className = "chips"; g.appendChild(c);
  for (const [val, text] of items){
    const b = document.createElement("button"); b.type = "button"; b.dataset.key = key; b.dataset.val = val;
    if (swatch){ b.className = "sw"; b.style.background = val; b.setAttribute("aria-label", `${LABEL[key]} ${val}`); } else b.textContent = text;
    b.addEventListener("click", () => { state[key] = val; render(); });
    c.appendChild(b);
  }
  panel.appendChild(g); groups.push(c);
}
function syncPressed(){ for (const b of panel.querySelectorAll("button")) b.setAttribute("aria-pressed", String(state[b.dataset.key] === b.dataset.val)); }
group("hair", PARTS.hair); group("top", PARTS.top); group("bottom", PARTS.bottom);
group("hairC", COLORS.hair.map(c => [c]), true); group("skin", COLORS.skin.map(c => [c]), true);
group("shirt", COLORS.shirt.map(c => [c]), true); group("inner", COLORS.inner.map(c => [c]), true);
group("tee", COLORS.tee.map(c => [c]), true); group("pants", COLORS.pants.map(c => [c]), true);
const pick = a => a[Math.floor(Math.random() * a.length)];
document.getElementById("btnRandom").addEventListener("click", () => {
  Object.assign(state, {hair:pick(PARTS.hair)[0], top:pick(PARTS.top)[0], bottom:pick(PARTS.bottom)[0], hairC:pick(COLORS.hair),
    skin:pick(COLORS.skin), shirt:pick(COLORS.shirt), inner:pick(COLORS.inner), tee:pick(COLORS.tee), pants:pick(COLORS.pants)});
  render();
});
const shapes = PARTS.hair.length * PARTS.top.length * PARTS.bottom.length;
document.getElementById("count").textContent = `모양 조합 ${shapes}가지 × 색 조합 ${Object.values(COLORS).reduce((a, c) => a * c.length, 1).toLocaleString()}가지`;
load().then(render);
</script>
